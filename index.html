<!doctype html>
<html lang="it">
<head>

<title>Ritmica 0.7 · Web</title>
<style>
:root { font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif; color:#20252b; background:#f6f7f8; font-size:13px; }
* { box-sizing:border-box; }
body { margin:0; }
button,input,select { font:inherit; color:inherit; }
button { cursor:pointer; }

.app { display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh; }
aside { padding:19px 15px; background:#f1f2f4; border-right:1px solid #dfe2e5; display:flex; flex-direction:column; gap:21px; }

.add-line { display:flex;gap:5px;margin-top:10px; }

.side-row label { min-width:0; }
.mini-label { display:block;font-size:11px;color:#6f747b;margin-bottom:5px; }
select,input[type=number] { border:1px solid #cfd4d9;border-radius:5px; padding:7px 8px; background:white;min-width:0;max-width:100%; }
.select-styled { width:100%; }
.side-add { border:1px solid #cfd4d9;border-radius:5px;background:white;width:35px;font-size:19px; }
.audio { display:flex;flex-direction:column;gap:9px; }
.audio label { display:flex;align-items:center;gap:7px;color:#4d565e;font-size:12px; }
.audio input[type=range] { width:95px; }
#midiInfo { font-size:11px;line-height:1.4;color:#687078;overflow-wrap:anywhere; }
main { min-width:0;display:flex;flex-direction:column; }
.topbar { background:white; padding:14px 22px;display:flex;gap:14px;justify-content:space-between;align-items:center;border-bottom:1px solid #e2e5e7;flex-wrap:wrap; }

.dur-grid { display:grid;grid-template-columns:repeat(8,minmax(34px,1fr));gap:4px; }

.pill-controls { display:flex;gap:5px;flex-wrap:wrap;align-items:center; }

.paper-header select { font-size:11px;padding:3px 8px; }

.score-holder.galley { display:flex;align-items:flex-start;gap:0; }

/* Event hit areas and the insertion cursor remain visible in multi-staff layouts. */
.note-hit { fill:transparent;stroke:transparent;cursor:pointer; }
.staff-hit { fill:transparent;stroke:transparent;cursor:crosshair;pointer-events:all; }
.staff-hit:hover { fill:#58a5cc09; }
.insert-caret { stroke:#168fc6;stroke-width:2.4;pointer-events:none; }
.caret-flag { fill:#168fc6;pointer-events:none; }
.staff-active .staff-hit { fill:#49a5d007; }
.staff-sub {font-size:10px;color:#64717c;display:block;margin-top:2px;}

.note-hit:hover { fill:#4aa3c02c;stroke:#9fc4d0;stroke-width:1.1; }
.note-hit.selected { fill:#298ac82c;stroke:#298ac8;stroke-width:1.1; }
.note-hit.playing { fill:#ecc34755;stroke:#d6a31e;stroke-width:1.4; }

.footer-block { font-size:11px;color:#6f7a84; }
.footer-block .subhead { font-weight:590;margin-bottom:6px; }

.mini-piano { display:flex;gap:3px;flex-wrap:wrap;margin-top:8px; }
.pkey { min-width:28px;height:30px;border:1px solid #cbd3d8;border-radius:4px;background:white;font-size:10px; }
.pkey.black { background:#394651;color:white;border-color:#394651; }
.small-btn { border:1px solid #d4dae0;border-radius:4px;background:white;padding:4px 7px;cursor:pointer; }
.statusbar { border-top:1px solid #e0e4e7;background:white;padding:9px 20px;display:flex;justify-content:space-between;gap:12px;color:#647078;font-size:11px;min-height:36px; }
.toast { position:fixed;bottom:20px;right:20px;background:#263947;color:white;border-radius:6px;padding:11px 14px;font-size:12px;max-width:420px;box-shadow:0 5px 20px #0002;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10; }
.toast.show { opacity:1; }
.status-dot { display:inline-block;width:7px;height:7px;border-radius:50%;background:#aaa;vertical-align:middle;margin-right:4px; }
.status-dot.ok { background:#498975; }.status-dot.warn { background:#b98a43; }
.error { padding:20px;color:#893f34; }
input[type=file] { display:none; }
@media(max-width:1050px) { .app { grid-template-columns:205px minmax(0,1fr); }.tool-card.durations { min-width:300px; }.workspace { padding:14px; } }
@media(max-width:700px) { .app { display:block; } aside { border-right:none;border-bottom:1px solid #ddd; } .tool-card { width:100%;min-width:0!important; }.dur-grid { grid-template-columns:repeat(8,minmax(0,1fr)); }.topbar { padding:11px; }.workspace { padding:11px; } }

<script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js" defer></script>
<script>
(() => {
'use strict';
const T = 10080;
const INSTRUMENTS = [
  {id:'violin',name:'Violino',abbr:'Vln.',clef:'treble',gm:41,wave:'sawtooth'},
  {id:'bass',name:'Basso',abbr:'B.',clef:'bass',gm:44,wave:'triangle'},
  {id:'keyboardUpper',name:'Tastiera',abbr:'Tast.',clef:'treble',gm:7,wave:'triangle'},
  {id:'keyboardLower',name:'Tastiera',abbr:'',clef:'bass',gm:7,wave:'triangle'}
];
const INSTRUMENT_CHOICES=[{id:'violin',name:'Violino'},{id:'bass',name:'Basso'},{id:'keyboard',name:'Tastiera (2 righi)'}];
const DURATIONS = [
  {key:'1',name:'Biscroma',symbol:'𝅘𝅥𝅰',duration:'32',ticks:T/8},
  {key:'2',name:'Semicroma',symbol:'𝅘𝅥𝅯',duration:'16',ticks:T/4},
  {key:'3',name:'Croma',symbol:'𝅘𝅥𝅮',duration:'8',ticks:T/2},
  {key:'4',name:'Semiminima',symbol:'♩',duration:'q',ticks:T},
  {key:'5',name:'Minima',symbol:'𝅗𝅥',duration:'h',ticks:T*2},
  {key:'6',name:'Semibreve',symbol:'𝅝',duration:'w',ticks:T*4}
];
const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,10);
const clone=x=>JSON.parse(JSON.stringify(x));
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
function newPart(type){const d=INSTRUMENTS.find(x=>x.id===type)||INSTRUMENTS[0];return {id:uid(),type:d.id,name:d.name,abbr:d.abbr,clef:d.clef,gm:d.gm,voices:[[],[]]};}
function newInstrument(type){if(type!=='keyboard')return [newPart(type)];const gid=uid();const a=newPart('keyboardUpper'),b=newPart('keyboardLower');a.groupId=gid;b.groupId=gid;a.staffNum=1;b.staffNum=2;return [a,b];}
function logicalParts(){const out=[];for(const p of score.parts){if(p.groupId&&p.staffNum===2)continue;out.push(p.groupId?[p,score.parts.find(q=>q.groupId===p.groupId&&q.staffNum===2)].filter(Boolean):[p]);}return out;}
let score={title:'Nuova trascrizione',meter:[4,4],pickupTicks:0,fifths:0,mode:'major',tempo:100,parts:[newPart('violin')]};
let chosenPart=score.parts[0].id, chosenVoice=0, durationKey='4', lastDotId=null, selectedId=null, pitchIndex=0, pitchOctave=4, pendingAcc=null, pendingTriplet=null, rhythmsSincePitch=0, armedSelectionId=null;
let viewMode='galley', insertTarget=null, graceHeld=false, gracePending=null;
let undoStack=[],redoStack=[], renderedMap=new Map(), midiAccess=null, midiPending=[],midiFlushTimer=null, audio=null, activeNodes=[], playTimers=[], playing=false, volume=.58, deferredRender=false, playHead=null;
const TOTAL_BEATS=()=>score.meter[0]*(T*4/score.meter[1]);
const currentPart=()=>score.parts.find(x=>x.id===chosenPart)||score.parts[0];
const stream=()=>currentPart().voices[chosenVoice];
const FULL_BAR=()=>score.meter[0]*(T*4/score.meter[1]);
const barCapacity=b=>b===0&&score.pickupTicks>0?score.pickupTicks:FULL_BAR();
const measureTicks=e=>{if(e.grace)return 0;const def=DURATIONS.find(d=>d.key===e.base)||DURATIONS[3];let ticks=def.ticks*(e.dot?3/2:1);if(e.tuplet)ticks=ticks*2/3;return ticks;};
const usedTicks=events=>events.reduce((a,e)=>a+measureTicks(e),0);
function endPosition(events){let bar=0,t=0;for(const ev of events){const dt=measureTicks(ev);if(Math.abs(t-barCapacity(bar))<.001){bar++;t=0;}t+=dt;}if(t>0&&Math.abs(t-barCapacity(bar))<.001){bar++;t=0;}return {bar,t};}
const phaseInBar=events=>endPosition(events).t;
const lookupEvent=(id)=>{if(!id)return null;for(const p of score.parts)for(let v=0;v<2;v++){const idx=p.voices[v].findIndex(e=>e.id===id);if(idx>=0)return {part:p,voice:v,index:idx,event:p.voices[v][idx]};}return null;};
const eventCount=()=>score.parts.reduce((a,p)=>a+p.voices.reduce((b,v)=>b+v.length,0),0);
function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').classList.remove('show'),3500);setStatus(msg);}
function setStatus(msg){$('status').textContent=msg;}
function saveUndo(){undoStack.push(JSON.stringify({score,chosenPart,chosenVoice,selectedId,pitchIndex,insertTarget}));if(undoStack.length>80)undoStack.shift();redoStack=[];}
function restore(raw){const s=JSON.parse(raw);score=s.score;score.pickupTicks=score.pickupTicks||0;score.mode=score.mode==='minor'?'minor':'major';chosenPart=s.chosenPart;chosenVoice=s.chosenVoice;selectedId=s.selectedId;pitchIndex=s.pitchIndex;insertTarget=s.insertTarget||null;lastDotId=null;pendingTriplet=null;pendingAcc=null;rhythmsSincePitch=0;armedSelectionId=null;refresh();}
function undo(){if(!undoStack.length)return;redoStack.push(JSON.stringify({score,chosenPart,chosenVoice,selectedId,pitchIndex,insertTarget}));restore(undoStack.pop());toast('Operazione annullata');}
function redo(){if(!redoStack.length)return;undoStack.push(JSON.stringify({score,chosenPart,chosenVoice,selectedId,pitchIndex,insertTarget}));restore(redoStack.pop());toast('Operazione ripristinata');}
function eventMeasures(events){let out=[[]],t=0,bar=0;for(const e of events){const dt=measureTicks(e);if(Math.abs(t-barCapacity(bar))<.001){out.push([]);bar++;t=0;}out[out.length-1].push(e);t+=dt;}return out;}
function barsCount(){return Math.max(1,...score.parts.flatMap(p=>p.voices.map(v=>eventMeasures(v).length)));}
function eventAtBar(p,v,bar){return eventMeasures(p.voices[v])[bar]||[];}
function seekPitch(){
 const s=stream();const n=s.findIndex(e=>!e.rest&&!e.pitches.length);
 pitchIndex=n<0?s.length:n;
 return n;
}
function selectStaff(id){chosenPart=id;chosenVoice=0;pitchIndex=0;selectedId=null;insertTarget={partId:id,voice:0,bar:endPosition(currentPart().voices[0]).bar,index:currentPart().voices[0].length};lastDotId=null;pendingTriplet=null;rhythmsSincePitch=0;armedSelectionId=null;seekPitch();refresh();}
function addStaff(){saveUndo();const id=$('instrumentPick').value,add=newInstrument(id);let duplicates=logicalParts().filter(g=>g[0].type===add[0].type).length;
 if(duplicates){for(const p of add)p.name+=` ${duplicates+1}`;}
 score.parts.push(...add);chosenPart=add[0].id;chosenVoice=0;selectedId=null;insertTarget={partId:chosenPart,voice:0,bar:0,index:0};pitchIndex=0;armedSelectionId=null;rhythmsSincePitch=0;refresh();}
function removeStaff(){if(logicalParts().length===1){toast('La partitura deve contenere almeno uno strumento.');return;}saveUndo();const p=currentPart();score.parts=score.parts.filter(q=>p.groupId?q.groupId!==p.groupId:q.id!==p.id);chosenPart=score.parts[0].id;chosenVoice=0;selectedId=null;insertTarget=null;pitchIndex=0;armedSelectionId=null;rhythmsSincePitch=0;refresh();}
function fillEarlierBars(v,targetBar){let pos=endPosition(v);while(pos.bar<targetBar){const cap=barCapacity(pos.bar),need=cap-pos.t;if(need>0.001)v.push(...restsForTicks(need));pos=endPosition(v);if(pos.bar<targetBar&&pos.t===0){/* waiting for a following measure */} if(pos.bar===targetBar)break;}
}
function insertAtCursor(v,candidate){
 const target=insertTarget?.partId===chosenPart&&insertTarget.voice===chosenVoice?insertTarget:null;
 if(!target){const pos=endPosition(v),cap=barCapacity(pos.bar),dt=measureTicks(candidate);if(dt>cap-pos.t+.001)return {error:cap-pos.t};v.push(candidate);return {begins:pos.t===0};}
 const bar=target.bar,existing=eventMeasures(v),within=existing[bar]||[];
 // The cursor can extend the same part into bars already present in other instruments.
 const pos=endPosition(v);if(bar>pos.bar){fillEarlierBars(v,bar);}
 const ms=eventMeasures(v),group=ms[bar]||[],used=usedTicks(group),dt=measureTicks(candidate);
 if(dt>barCapacity(bar)-used+.001)return {error:barCapacity(bar)-used};
 let globalIdx=target.index;
 if(group.length){const first=v.findIndex(e=>e.id===group[0].id);const start=first>=0?first:v.length;globalIdx=Math.max(start,Math.min(start+group.length,globalIdx));}
 else globalIdx=v.length;
 v.splice(globalIdx,0,candidate);return {begins:used===0};
}
function placeRhythm(key,rest=false){const p=currentPart(),v=stream();const d=DURATIONS.find(x=>x.key===key);if(!d)return;
 const grace=gracePending||(graceHeld?'acciaccatura':null);if(grace&&rest){toast('Gli abbellimenti richiedono una nota.');return;}
 const trip=pendingTriplet;if(trip&&grace){toast('Termina la terzina prima di aggiungere un abbellimento.');return;}
 if(trip&&trip.base&&trip.base!==key){toast('La terzina attiva richiede tre durate uguali.');return;}
 const candidate={id:uid(),base:key,dot:false,rest,pitches:[],tuplet:trip?trip.id:null,tieToNext:false,...(grace?{grace}:{})};
 const prior=endPosition(v),target=insertTarget?.partId===chosenPart&&insertTarget.voice===chosenVoice?insertTarget:null;
 let cap=barCapacity(target?target.bar:prior.bar),available=cap-(target?usedTicks(eventMeasures(v)[target.bar]||[]):prior.t),dt=measureTicks(candidate);
 if(dt>available+.001){toast('La battuta non ha spazio sufficiente per questa figura.');return;}
 if(trip&&trip.index===0&&3*dt>available+.001){toast('La terzina non può oltrepassare la battuta.');return;}
 saveUndo();const added=insertAtCursor(v,candidate);if(added.error!==undefined){undoStack.pop();toast('Posizione senza spazio disponibile.');return;}
 selectedId=candidate.id;lastDotId=grace?null:candidate.id;durationKey=key;armedSelectionId=null;rhythmsSincePitch++;seekPitch();
 if(trip){trip.base=key;trip.index++;if(trip.index===3)pendingTriplet=null;}
 if(gracePending)gracePending=null;
 const found=v.findIndex(e=>e.id===candidate.id),writtenBar=findEventBar(v,candidate.id),complete=usedTicks(eventMeasures(v)[writtenBar]||[])>=barCapacity(writtenBar)-.001;insertTarget={partId:chosenPart,voice:chosenVoice,bar:complete&&found===v.length-1?writtenBar+1:writtenBar,index:found+1};
 if(added.begins&&!grace)synthCymbal();if(!grace)synthDrum(key);
 refresh();setStatus(`${grace==='acciaccatura'?'Acciaccatura':grace==='appoggiatura'?'Appoggiatura':rest?'Pausa':'Figura'} ${d.name} · ${p.name}`);
}
function findEventBar(v,id){return eventMeasures(v).findIndex(m=>m.some(e=>e.id===id));}
function insertRest(){placeRhythm(durationKey,true);}
// Numpad 0: converte la figura selezionata in pausa della stessa durata.
// Il pulsante 'Pausa +' aggiunge invece una nuova pausa della durata corrente.
function toggleRest(){
 const f=lookupEvent(selectedId);
 if(!f||f.part.id!==chosenPart||f.voice!==chosenVoice){insertRest();return;}if(f.event.grace){toast('Un abbellimento non può diventare una pausa.');return;}
 saveUndo();f.event.rest=!f.event.rest;f.event.pitches=[];f.event.tieToNext=false;
 if(f.event.rest)lastDotId=null;
 armedSelectionId=null;rhythmsSincePitch=0;seekPitch();refresh();
 setStatus(f.event.rest?'Figura trasformata in pausa.':'Pausa trasformata in figura senza altezza.');
}

function applyDot(){const found=lookupEvent(lastDotId);if(!found||found.part.id!==chosenPart||found.voice!==chosenVoice||found.event.dot){toast('Il punto si applica solo all’ultima figura inserita.');return;}
  if(found.event.grace){toast('Non è disponibile il punto per gli abbellimenti.');return;}if(found.event.tuplet){toast('In questa versione non sono ancora disponibili note puntate dentro una terzina.');return;}
  const s=stream(),bar=findEventBar(s,found.event.id),contained=eventMeasures(s)[bar]||[],extra=measureTicks(found.event)/2;
  if(usedTicks(contained)+extra>barCapacity(bar)+.001){toast('Il punto oltrepasserebbe la stanghetta.');return;}
  saveUndo();found.event.dot=true;lastDotId=null;refresh();synthDrum(found.event.base);setStatus('Punto aggiunto all’ultima figura. La prossima figura sarà senza punto.');
}
function beginTriplet(){if(pendingTriplet){pendingTriplet=null;toast('Terzina annullata.');}else{pendingTriplet={id:uid(),base:null,index:0};toast('Terzina attiva: inserisci tre note o pause dello stesso valore.');}refresh();}
function toggleTie(){const s=stream();const target=lookupEvent(selectedId)|| (s.length?{event:s[s.length-1],part:currentPart(),voice:chosenVoice}:null);if(!target||target.event.rest){toast('Seleziona una nota, non una pausa.');return;}saveUndo();target.event.tieToNext=!target.event.tieToNext;refresh();toast(target.event.tieToNext?'Legatura di valore impostata (necessita di una nota uguale successiva).':'Legatura rimossa.');}
function restsForTicks(ticks){
 const out=[];const defs=[...DURATIONS].reverse();let left=ticks;
 for(const d of defs)while(left+0.001>=d.ticks){out.push({id:uid(),base:d.key,dot:false,rest:true,pitches:[],tuplet:null,tieToNext:false});left-=d.ticks;}
 if(left>.001)throw Error('Durata non rappresentabile: '+left);
 return out;
}
function deleteEvent(){
 const s=stream();if(!s.length)return;
 const found=lookupEvent(selectedId);const idx=found?.part.id===chosenPart&&found?.voice===chosenVoice?found.index:s.length-1;
 const current=s[idx],ids=new Set(current.tuplet?s.filter(e=>e.tuplet===current.tuplet).map(e=>e.id):[current.id]);
 const measures=eventMeasures(s),bar=measures.findIndex(m=>m.some(e=>ids.has(e.id)));
 if(bar<0)return;
 const removed=measures[bar].filter(e=>ids.has(e.id));const removedTicks=usedTicks(removed);
 // Un gruppo di terzina viene eliminato insieme, senza lasciare terzine incomplete.
 if(current.tuplet&&removed.length!==3){toast('Terzina incompleta: correggi il gruppo prima di cancellare.');return;}
 saveUndo();measures[bar]=measures[bar].filter(e=>!ids.has(e.id));
 // Conserva la posizione delle battute successive: completa con pause alla fine della battuta modificata.
 if(bar<measures.length-1&&removedTicks>0)measures[bar].push(...restsForTicks(removedTicks));
 currentPart().voices[chosenVoice]=measures.flat();
 const v=stream();selectedId=v.length?v[Math.min(idx,v.length-1)].id:null;
 lastDotId=null;pendingTriplet=null;rhythmsSincePitch=0;armedSelectionId=null;seekPitch();refresh();

}

function downloadFile(content,name,mime){let u=URL.createObjectURL(new Blob([content],{type:mime})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500);}
function saveProject(){downloadFile(JSON.stringify({format:'ritmica-project-1',score},null,2),slug(score.title)+'.ritmica.json','application/json;charset=utf-8');toast('Progetto salvato in JSON.');}
async function loadProject(e){const f=e.target.files?.[0];if(!f)return;try{const data=JSON.parse(await f.text());if(data.format!=='ritmica-project-1'||!data.score?.parts?.length)throw Error('Formato non valido');saveUndo();score=data.score;score.pickupTicks=score.pickupTicks||0;score.mode=score.mode==='minor'?'minor':'major';chosenPart=score.parts[0].id;chosenVoice=0;selectedId=null;pitchIndex=0;armedSelectionId=null;rhythmsSincePitch=0;refresh();toast('Progetto caricato.');}catch(err){toast('Errore: '+err.message);}e.target.value='';}
// --- EXAMPLE & EVENTS ---
function loadDemo(){saveUndo();score={title:'Esempio di trascrizione barocca',meter:[4,4],fifths:0,mode:'major',tempo:108,parts:[newPart('violin'),newPart('bass')]};const first=[72,74,76,79,77,76,74,72,71,69,71,72,74,72,71,69];for(const [i,m] of first.entries())score.parts[0].voices[0].push({id:uid(),base:'3',dot:false,rest:false,pitches:[spellPitch(m)],tuplet:null,tieToNext:false});for(const m of [48,55,52,55,53,57,55,48])score.parts[1].voices[0].push({id:uid(),base:'4',dot:false,rest:false,pitches:[spellPitch(m)],tuplet:null,tieToNext:false});chosenPart=score.parts[0].id;chosenVoice=0;selectedId=null;lastDotId=null;pendingTriplet=null;pitchIndex=0;armedSelectionId=null;rhythmsSincePitch=0;refresh();toast('Caricato un breve esempio a due strumenti.');}
function restoreKeyboardFocus(el){el.blur();}
function setup(){for(const ins of INSTRUMENT_CHOICES){const o=document.createElement('option');o.value=ins.id;o.textContent=ins.name;$('instrumentPick').append(o);}const h=$('durationKeys');for(const d of DURATIONS){let b=document.createElement('button');b.id='dur-'+d.key;b.className='dur-key'+(durationKey===d.key?' selected':'');b.title=d.name;b.innerHTML=`<span class="music">${d.symbol}</span><small>${d.key}</small>`;b.addEventListener('click',e=>placeRhythm(d.key,e.shiftKey));b.addEventListener('contextmenu',e=>{e.preventDefault();placeRhythm(d.key,true);});h.append(b);}h.append(Object.assign(document.createElement('button'),{className:'dur-key',innerHTML:'<span class="music">𝄽</span><small>Pausa +</small>',title:'Aggiungi una nuova pausa della durata selezionata'}));h.lastChild.addEventListener('click',insertRest);h.append(Object.assign(document.createElement('button'),{className:'dur-key',innerHTML:'<span class="music">·</span><small>.</small>',title:'Punto dopo l’ultima figura'}));h.lastChild.addEventListener('click',applyDot);
 const p=$('piano');for(let i=0;i<12;i++){const semitone=i,names=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'],b=document.createElement('button');b.className='pkey'+([1,3,6,8,10].includes(i)?' black':'');b.textContent=names[i];b.title=names[i]+pitchOctave;b.addEventListener('click',()=>assignPitches([12*(pitchOctave+1)+semitone]));p.append(b);}
 const events={addStaff,removeStaff,connectMidi:connectMIDI,undo,redo,play:startPlayback,stop:stopPlayback,saveProject,openProject:()=>$('projectFile').click(),exportXML:exportMusicXML,tripletButton:beginTriplet,tieButton:toggleTie,deleteButton:deleteEvent,respell,demo:loadDemo,octDown:()=>setOctave(pitchOctave-1),octUp:()=>setOctave(pitchOctave+1)};
 for(const [id,action] of Object.entries(events))$(id).addEventListener('click',action);for(const b of document.querySelectorAll('[data-acc]'))b.addEventListener('click',()=>setAcc(Number(b.dataset.acc)));
 $('voice').addEventListener('change',e=>{restoreKeyboardFocus(e.target);chosenVoice=Number(e.target.value);pitchIndex=0;selectedId=null;armedSelectionId=null;rhythmsSincePitch=0;seekPitch();refresh();});
 $('clef').addEventListener('change',e=>{changeClef(e.target.value);restoreKeyboardFocus(e.target);});
 $('meter').addEventListener('change',e=>{restoreKeyboardFocus(e.target);const next=e.target.value.split('/').map(Number),old=score.meter.slice();if(eventCount()){const prior=score.meter;score.meter=next;let bad=false;for(const part of score.parts)for(const voice of part.voices){let t=0;for(const ev of voice){if(t+measureTicks(ev)>TOTAL_BEATS()+.0001){bad=true;break;}t+=measureTicks(ev);if(t===TOTAL_BEATS())t=0;}}score.meter=prior;if(bad){e.target.value=old.join('/');toast('Il nuovo metro interromperebbe una nota. Completa o modifica il brano prima di cambiare metro.');return;}}saveUndo();score.meter=next;if(score.pickupTicks>=TOTAL_BEATS())score.pickupTicks=0;refresh();});
 $('pickup').addEventListener('change',e=>{restoreKeyboardFocus(e.target);const val=Number(e.target.value);if(val>=TOTAL_BEATS()){e.target.value=String(score.pickupTicks||0);toast('L’anacrusi deve essere più breve della battuta intera.');return;}if(eventCount()){e.target.value=String(score.pickupTicks||0);toast('Imposta l’anacrusi prima di inserire note.');return;}saveUndo();score.pickupTicks=val;insertTarget={partId:chosenPart,voice:chosenVoice,bar:0,index:0};refresh();});
 $('keySig').addEventListener('change',e=>{restoreKeyboardFocus(e.target);saveUndo();score.fifths=Number(e.target.value);refresh();});
 $('mode').addEventListener('change',e=>{restoreKeyboardFocus(e.target);saveUndo();score.mode=e.target.value==='minor'?'minor':'major';refresh();});
 $('viewMode').addEventListener('change',e=>{viewMode=e.target.value==='page'?'page':'galley';restoreKeyboardFocus(e.target);$('scoreHolder').scrollLeft=0;queueRender();});
 $('tempo').addEventListener('change',e=>{restoreKeyboardFocus(e.target);saveUndo();score.tempo=Math.min(240,Math.max(30,Number(e.target.value)||100));refresh();});
 $('title').addEventListener('change',e=>{score.title=e.target.value.trim()||'Nuova trascrizione';refresh();});
 $('projectFile').addEventListener('change',loadProject);$('volume').addEventListener('input',e=>volume=Number(e.target.value)/100);$('midiInfo').textContent=midiGuidance();
 document.addEventListener('keydown',keyHandler);document.addEventListener('keyup',e=>{if(e.code==='Minus')graceHeld=false;});window.addEventListener('resize',()=>queueRender());insertTarget={partId:chosenPart,voice:0,bar:0,index:0};refresh();setTimeout(queueRender,1300);
}
function setOctave(n){pitchOctave=Math.max(1,Math.min(7,n));$('octaveText').textContent=pitchOctave;}
function keyHandler(e){
 const target=e.target;if(target instanceof HTMLInputElement||target instanceof HTMLSelectElement||target instanceof HTMLTextAreaElement||target?.isContentEditable)return;
 const k=e.key,code=e.code,cmd=e.metaKey||e.ctrlKey;if(cmd&&k.toLowerCase()==='z'){e.preventDefault();if(e.shiftKey)redo();else undo();return;}if(cmd&&k.toLowerCase()==='s'){e.preventDefault();saveProject();return;}if(cmd&&k==='3'){e.preventDefault();beginTriplet();return;}
 if(code==='Minus'&&!cmd){e.preventDefault();if(e.shiftKey){gracePending='appoggiatura';graceHeld=false;setStatus('Appoggiatura: scegli una durata (1–6).');}else{graceHeld=true;setStatus('Acciaccatura: tieni premuto − e scegli una durata (1–6).');}return;}
 if(k===' '){e.preventDefault();startPlayback();return;}if(k==='Escape'){stopPlayback();return;}
 if(k==='ArrowRight'){e.preventDefault();advancePitch(1);return;}if(k==='ArrowLeft'){e.preventDefault();advancePitch(-1);return;}
 if(k==='ArrowUp'){e.preventDefault();movePitch(1);return;}if(k==='ArrowDown'){e.preventDefault();movePitch(-1);return;}
 if(k==='Backspace'||k==='Delete'){e.preventDefault();deleteEvent();return;}
 if(k==='Enter'){e.preventDefault();if(e.shiftKey)toggleTie();else respell();return;}
 if(k==='.'||code==='NumpadDecimal'){e.preventDefault();applyDot();return;}
 const digitMatch=code.match(/^(?:Numpad|Digit)([1-9])$/);
 if(digitMatch&&!cmd){const n=Number(digitMatch[1]);e.preventDefault();if(n<=6)placeRhythm(String(n),e.shiftKey);else setAcc(({7:0,8:1,9:-1})[n]);return;}
 if(code==='Numpad0'||code==='Digit0'){e.preventDefault();toggleRest();return;}
 if((k==='t'||k==='T')&&!cmd){e.preventDefault();beginTriplet();return;}
 if(/^[a-g]$/i.test(k)&&!cmd){e.preventDefault();const midi=12*(pitchOctave+1)+SEMIS[k.toUpperCase()];assignPitches([midi]);return;}
 if(k==='['){e.preventDefault();setOctave(pitchOctave-1);}if(k===']'){e.preventDefault();setOctave(pitchOctave+1);}
}
window.RitmicaDebug={getXML:buildMusicXML,addInstrument:(type)=>{ $('instrumentPick').value=type;addStaff();},setPickup:t=>{score.pickupTicks=t;refresh();},setGrace:val=>{gracePending=val;},clickEmptyStaff,logicalParts,barCapacity,eventMeasures,findEventBar,getScore:()=>clone(score),loadDemo,exportXML:()=>{const flaws=canExport();if(flaws.length)throw Error(flaws.join(', '));return score;},insert:key=>placeRhythm(key),dot:applyDot,pitch:notes=>assignPitches(notes),toggleRest,deleteEvent,respell,movePitch,updateSelection,changeClef,measureTicks,intervalWarning,spellPitch,minorKeyInfo,spellingContext,systemsFor,focusScoreSelection,selectMode:mode=>{score.mode=mode;refresh();},selectKey:fifths=>{score.fifths=fifths;refresh();},view:mode=>{viewMode=mode;queueRender();},receiveMIDI:bytes=>midiMessage({data:bytes})};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',setup);else setup();
})();

</script>
</head>
<body>
<div class="app">
<aside>
  <div class="brand"><strong>Ritmica</strong></div>
  <section>
    <div class="section-title">Pentagrammi <span id="partCount">1</span></div>
    <div id="staffList" class="staff-list"></div>
    <div class="add-line"><select id="instrumentPick" aria-label="Strumento"></select><button id="addStaff" class="side-add" title="Aggiungi pentagramma">+</button></div>
    <button id="removeStaff" class="btn" style="width:100%;margin-top:6px">Rimuovi</button>
  </section>
  <section>
    <div class="side-row"><label><span class="mini-label">Metro</span><select id="meter" class="select-styled"><option>4/4</option><option>3/4</option><option>2/4</option><option>6/8</option><option>3/8</option><option>9/8</option><option>12/8</option><option>2/2</option><option>5/4</option><option>7/8</option></select></label>
    <label><span class="mini-label">Armatura (tonalità)</span><select id="keySig" class="select-styled"><option value="0">Do</option><option value="1">Sol</option><option value="2">Re</option><option value="3">La</option><option value="4">Mi</option><option value="5">Si</option><option value="-1">Fa</option><option value="-2">Si♭</option><option value="-3">Mi♭</option><option value="-4">La♭</option><option value="-5">Re♭</option></select></label></div>
    <div class="side-row"><label><span class="mini-label">Anacrusi</span><select id="pickup" class="select-styled"><option value="0">Nessuna</option><option value="1260">1/32</option><option value="2520">1/16</option><option value="5040">1/8</option><option value="10080">1/4</option><option value="15120">3/8</option><option value="20160">1/2</option><option value="30240">3/4</option></select></label>
    <label><span class="mini-label">Maggiore / Minore</span><select id="mode" class="select-styled"><option value="major">Maggiore</option><option value="minor">Minore</option></select></label></div>
    <div class="side-row"><label><span class="mini-label">Voce</span><select id="voice" class="select-styled"><option value="0">1</option><option value="1">2</option></select></label>
    <label><span class="mini-label">Chiave</span><select id="clef" class="select-styled"><option value="treble">Sol</option><option value="bass">Fa</option><option value="alto">Do (3ª)</option></select></label></div>
    <div class="side-row"><label><span class="mini-label">Tempo ♩=</span><input class="select-styled" id="tempo" type="number" min="30" max="240" value="100"></label></div>
  </section>
  <section class="audio">
    <div class="section-title">Audio / MIDI</div>
    <button class="btn" id="connectMidi">Collega MIDI</button>
    <div id="midiInfo" aria-live="polite">MIDI non collegato</div>
    <label><input id="enableDrums" type="checkbox" checked> Segnali ritmici</label>
    <label><input id="enableWarning" type="checkbox" checked> Avviso intervalli</label>
    <label>Volume <input id="volume" type="range" min="0" max="100" value="58"></label>
  </section>
</aside>
<main>
  <div class="topbar">
    <div><input id="title" class="document-name" value="Nuova trascrizione" aria-label="Titolo"><div id="documentCaption"></div></div>
    <div class="top-actions">
      <button class="btn" id="undo" title="Annulla">↶</button><button class="btn" id="redo" title="Ripristina">↷</button>
      <button class="btn" id="play">▶</button><button class="btn" id="stop">■</button>
      <button class="btn" id="saveProject">Salva</button><button class="btn" id="openProject">Apri</button><input type="file" accept=".json,application/json" id="projectFile">
      <button class="btn primary" id="exportXML">MusicXML ↓</button>
    </div>
  </div>
  <div class="workspace">
    <div class="tools">
      <div class="tool-card durations"><span class="tag">Ritmi</span><div class="dur-grid" id="durationKeys"></div></div>
      <div class="tool-card modifiers"><span class="tag">Modifiche</span>
        <div class="pill-controls"><button class="btn" id="tripletButton" title="Terzina (T)">3:2</button><button class="btn" id="tieButton" title="Legatura di valore (Shift+Invio)">⌒</button><button class="btn" id="deleteButton" title="Elimina">⌫</button><button class="btn" id="respell" title="Cambia enarmonia (Invio)">♯⇄♭</button></div>
        <div class="pill-controls"><button class="btn" data-acc="0" title="Bequadro (7)">♮</button><button class="btn" data-acc="1" title="Diesis (8)">♯</button><button class="btn" data-acc="-1" title="Bemolle (9)">♭</button></div>
      </div>
      <div class="shortcut-help">1–6 figura · 0 pausa ↔ nota · ⇧1–6 nuova pausa · . punto<br>MIDI altezza · ↑↓ sposta · Invio enarmonia · ⌫ elimina<br>− + durata acciaccatura · ⇧− appoggiatura · clic sul rigo inserisce</div>
    </div>
    <div class="info-line"><span id="selectionInfo"></span><span><i class="status-dot" id="engineDot"></i><span id="engineInfo"></span></span></div>
    <div class="paper"><div class="paper-header"><label>Vista <select id="viewMode" aria-label="Vista partitura"><option value="galley">Galley orizzontale</option><option value="page">Pagina</option></select></label><span id="scoreStats"></span></div><div id="scoreHolder" class="score-holder galley"></div></div>
    <div class="footer-panel"><details><summary>Inserimento senza MIDI</summary><div class="footer-block" style="padding:9px 0"><div>Ottava <span id="octaveText">4</span> <button class="small-btn" id="octDown">−</button> <button class="small-btn" id="octUp">+</button></div><div id="piano" class="mini-piano"></div></div></details><div id="validation"></div></div>
  </div>
  <div class="statusbar"><span id="status"></span><button class="small-btn" id="demo">Esempio</button></div>
</main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
